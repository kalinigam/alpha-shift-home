<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha Shift — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1813;--grey:#6f6a60;--paper:#faf7f1;--orange:#ff7a00;--orange-deep:#dd6600;
  --disp:"Geist",system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif;
  --pad:clamp(20px,5vw,72px);--gut:clamp(40px,6vw,104px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--disp);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
/* thread overlay spans the page */
#tl{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible}
#tsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#tmain{fill:none;stroke:url(#tg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#bead{fill:var(--orange)}#halo{fill:var(--orange);opacity:.16}

.hero{position:relative;z-index:2;min-height:100svh;display:grid;align-items:center;
  padding:clamp(90px,12vh,150px) 0 60px}
.hero-in{max-width:1280px;margin:0 auto;padding-inline:var(--pad);width:100%;
  display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center}
@media(max-width:900px){.hero-in{grid-template-columns:1fr}.hero-art{order:-1}}
.hero-l{padding-left:var(--gut)}
h1{margin:0;font-weight:600;letter-spacing:-.04em;line-height:.92;font-size:clamp(56px,10vw,140px)}
h1 .l1{display:block;overflow:hidden}
h1 .l2{display:block;overflow:hidden}
h1 .l1 span,h1 .l2 span{display:inline-block}       /* for the reveal */
h1 .w{font-family:var(--serif);font-weight:400;font-style:italic}
h1 .q{font-family:var(--serif);font-style:italic;color:var(--orange)}
.hero-art{position:relative}
#head{width:100%;height:auto;max-height:82vh;overflow:visible;display:block}
#head .fillp{fill:var(--ink)}
#head .maskp{fill:none;stroke:#fff;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
/* fallback if JS/GSAP fails: show the head solid, no mask */
.no-js #head [mask]{mask:none!important}

.cue{position:absolute;left:var(--pad);bottom:26px;z-index:2;display:flex;align-items:center;gap:12px;
  font-family:var(--serif);font-style:italic;font-size:16px;color:var(--grey)}
.cue .ln{position:relative;width:44px;height:1px;background:#ddd6c8;overflow:hidden}
.cue .ln::after{content:"";position:absolute;inset:0;width:40%;background:var(--orange);animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%{transform:translateX(-110%)}60%,100%{transform:translateX(280%)}}

/* room below the hero so the thread visibly spools onward */
.after{position:relative;z-index:2;height:70vh}
</style>
</head>
<body class="no-js">

      <stop offset="0" stop-color="#ff7a00"/><stop offset="1" stop-color="#dd6600"/></linearGradient></defs>
    <path id="tmain"></path><circle id="halo" r="10"></circle><circle id="bead" r="5"></circle>
  </svg>
</div>

<script>
document.body.classList.remove("no-js");
const head=document.getElementById("head");
const maskPaths=[...head.querySelectorAll(".maskp")];
const VB=(head.getAttribute("viewBox")||"0 0 410 642").split(" ").map(Number);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

let hasGSAP=window.gsap&&window.DrawSVGPlugin;
if(hasGSAP){gsap.registerPlugin(DrawSVGPlugin,ScrollTrigger);}

/* ---------- smooth scroll (Lenis) tied to ScrollTrigger ---------- */
if(hasGSAP&&window.Lenis&&!reduce){
  const lenis=new Lenis({lerp:.11});
  lenis.on("scroll",ScrollTrigger.update);
  gsap.ticker.add(t=>lenis.raf(t*1000));
  gsap.ticker.lagSmoothing(0);
}

/* ---------- HERO HEADING reveal ---------- */
if(hasGSAP&&!reduce){
  gsap.set("h1 .l1 span, h1 .l2 span",{yPercent:110});
  gsap.to("h1 .l1 span",{yPercent:0,duration:1,ease:"power3.out",delay:.15});
  gsap.to("h1 .l2 span",{yPercent:0,duration:1,ease:"power3.out",delay:.32});
}

/* ---------- HEAD draws itself (mask reveal via DrawSVG) ---------- */
function drawHead(){
  if(!hasGSAP||reduce){return;}   // fallback: mask shows nothing -> we disable mask so head is solid
  gsap.set(maskPaths,{drawSVG:"0%"});
  gsap.to(maskPaths,{drawSVG:"100%",duration:2.1,stagger:.14,ease:"power1.inOut",
    onComplete:()=>{ /* keep mask fully open */ }});
}
if(!hasGSAP||reduce){ head.querySelector("[mask]").removeAttribute("mask"); }  // solid fallback

/* ---------- THREAD spools from the tangle, scroll-linked ---------- */
const svg=document.getElementById("tsvg"),tmain=document.getElementById("tmain"),
  bead=document.getElementById("bead"),halo=document.getElementById("halo");
const TANGLE=[300,120];  // tangle location inside the head viewBox
const HH=n=>Math.round(n*10)/10;
function dt(el){const r=el.getBoundingClientRect();return{x:r.left+scrollX,y:r.top+scrollY,w:r.width,h:r.height};}
function buildThread(){
  const docH=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight),W=innerWidth;
  svg.setAttribute("viewBox",`0 0 ${W} ${docH}`);svg.setAttribute("width",W);svg.setAttribute("height",docH);
  const a=dt(head),sx=a.w/(VB[2]||410),sy=a.h/(VB[3]||642);
  const ox=a.x+TANGLE[0]*sx, oy=a.y+TANGLE[1]*sy;
  const gut=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gut"))||60;
  const innerEl=document.querySelector(".hero-in");
  const axisX=innerEl?Math.max(18,dt(innerEl).x+gut*0.4):40;
  const endY=docH-60;
  const pts=[[ox,oy],[ox-30,oy+70],[axisX+60,oy+180],[axisX,oy+300],[axisX-6,(oy+endY)/2],[axisX,endY]];
  let d=`M ${HH(pts[0][0])} ${HH(pts[0][1])}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=` C ${HH(c1[0])} ${HH(c1[1])} ${HH(c2[0])} ${HH(c2[1])} ${HH(p2[0])} ${HH(p2[1])}`;}
  tmain.setAttribute("d",d);
  return d;
}
function initThread(){
  buildThread();
  if(hasGSAP&&!reduce){
    gsap.set(tmain,{drawSVG:"0%"});
    ScrollTrigger.create({
      trigger:".hero",start:"top top",endTrigger:".after",end:"bottom bottom",scrub:.6,
      onUpdate:self=>{
        gsap.set(tmain,{drawSVG:"0% "+(self.progress*100)+"%"});
        const L=tmain.getTotalLength(),pt=tmain.getPointAtLength(L*self.progress);
        bead.setAttribute("cx",pt.x);bead.setAttribute("cy",pt.y);halo.setAttribute("cx",pt.x);halo.setAttribute("cy",pt.y);
        const on=self.progress>0.01&&self.progress<0.99;bead.style.opacity=on?1:0;halo.style.opacity=on?.16:0;
      }
    });
  } else {
    const L=tmain.getTotalLength();tmain.style.strokeDasharray=L;tmain.style.strokeDashoffset=L;
    addEventListener("scroll",()=>{const p=Math.min(1,scrollY/(document.body.scrollHeight-innerHeight));tmain.style.strokeDashoffset=L*(1-p);},{passive:true});
  }
}

function start(){ drawHead(); initThread(); if(hasGSAP)ScrollTrigger.refresh(); }
addEventListener("load",start);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{buildThread();if(hasGSAP)ScrollTrigger.refresh();});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{buildThread();if(hasGSAP)ScrollTrigger.refresh();},180);},{passive:true});
</script>
</body>
</html>
